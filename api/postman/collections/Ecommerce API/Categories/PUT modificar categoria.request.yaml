$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Descripció modificada"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => { pm.response.to.have.status(200); });
      pm.test("Descripció canviada", () => pm.expect(pm.response.json().data.description).to.eql("Descripció modificada"));
    language: text/javascript
order: 7000
