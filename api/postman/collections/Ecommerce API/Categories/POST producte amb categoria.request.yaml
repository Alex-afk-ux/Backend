$kind: http-request
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Xubasquero amb categoria",
      "price": 12.5,
      "stock": 10,
      "targetSpecies": "betta",
      "size": "S",
      "color": "blau",
      "category": "{{categoryId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", () => { pm.response.to.have.status(201); });
      pm.collectionVariables.set("productWithCategoryId", pm.response.json().data._id);
    language: text/javascript
order: 8000
