$kind: http-request
url: "{{baseUrl}}/api/products/{{productWithCategoryId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => { pm.response.to.have.status(200); });
      pm.test("category és un objecte amb nom i slug", () => { const c = pm.response.json().data.category; pm.expect(c).to.be.an("object"); pm.expect(c).to.have.property("name"); pm.expect(c).to.have.property("slug"); });
    language: text/javascript
order: 9000
