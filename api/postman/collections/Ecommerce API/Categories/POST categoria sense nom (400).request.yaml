$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "slug": "sense-nom-{{categorySlug}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 400", () => { pm.response.to.have.status(400); });
    language: text/javascript
order: 2000
