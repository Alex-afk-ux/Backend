$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Impermeables",
      "slug": "{{categorySlug}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 409", () => { pm.response.to.have.status(409); });
    language: text/javascript
order: 3000
