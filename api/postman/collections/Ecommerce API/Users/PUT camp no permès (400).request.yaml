$kind: http-request
url: "{{baseUrl}}/api/users/{{userId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "admin"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 400", () => { pm.response.to.have.status(400); });
    language: text/javascript
order: 8000
