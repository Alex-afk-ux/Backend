$kind: http-request
url: "{{baseUrl}}/api/users/{{userId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => { pm.response.to.have.status(200); });
      pm.test("active és false", () => pm.expect(pm.response.json().data.active).to.eql(false));
    language: text/javascript
order: 10000
