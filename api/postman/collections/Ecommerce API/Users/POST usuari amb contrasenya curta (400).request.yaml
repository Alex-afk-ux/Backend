$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Curt",
      "email": "curt{{userEmail}}",
      "password": "curta"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 400", () => { pm.response.to.have.status(400); });
    language: text/javascript
order: 3000
