$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Admin",
      "email": "admin{{userEmail}}",
      "password": "contrasenya-segura-1",
      "role": "admin"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 400", () => { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
